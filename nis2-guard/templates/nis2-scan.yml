# Copy to .github/workflows/nis2-scan.yml and adjust the scanner path and frameworks.
# Actions are pinned to commit SHAs (tag in the comment). Let Dependabot update them.
name: Compliance scan (NIS2 · GDPR · AI Act · DORA)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compliance scan
        run: >
          python tools/nis2-guard/scripts/nis2_scan.py .
          --framework all
          --format md --output nis2-report.md
          --exclude "tests/*" --exclude "tools/nis2-guard/*"
          --fail-on high
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nis2-report
          path: nis2-report.md
