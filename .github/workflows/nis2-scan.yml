name: Compliance scan (NIS2, GDPR, AI Act, DORA)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tag in the comment). Dependabot keeps them updated.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s nis2-guard/tests -v
      - name: Compliance scan
        run: >
          python nis2-guard/scripts/nis2_scan.py .
          --framework all
          --format md --output nis2-report.md
          --exclude "nis2-guard/*"
          --fail-on high
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nis2-report
          path: nis2-report.md
